<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>残响纪元 - Ash Echoes</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0f;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Courier New', monospace;
      overflow: hidden;
    }
    #game-container {
      position: relative;
      border: 2px solid #ff6b35;
      box-shadow: 0 0 30px rgba(255, 107, 53, 0.3);
    }
    canvas {
      display: block;
      background: #12121a;
    }
    #ui-overlay {
      position: absolute;
      top: 0; left: 0; right: 0;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
    }
    .hp-bar {
      width: 180px; height: 14px;
      background: #1a1a2e;
      border: 1px solid #ff6b35;
      border-radius: 2px;
      overflow: hidden;
    }
    .hp-fill {
      height: 100%;
      background: linear-gradient(90deg, #ff6b35, #ff9f1c);
      transition: width 0.2s;
    }
    .echo-bar {
      width: 120px; height: 10px;
      background: #1a1a2e;
      border: 1px solid #00d4ff;
      border-radius: 2px;
      overflow: hidden;
    }
    .echo-fill {
      height: 100%;
      background: linear-gradient(90deg, #00d4ff, #7b2cbf);
      transition: width 0.15s;
    }
    .stat-label {
      color: #ff9f1c;
      font-size: 11px;
      margin-bottom: 3px;
    }
    .hp-container, .echo-container { display: flex; flex-direction: column; }
    .hp-container { margin-right: 20px; }
    #resonance-indicator {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      color: #7b2cbf;
      font-size: 12px;
      text-align: center;
      pointer-events: none;
    }
    #corruption-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: radial-gradient(ellipse at center, transparent 50%, rgba(123, 44, 191, 0.15) 100%);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.5s;
    }
    #start-screen, #game-over-screen {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(10, 10, 15, 0.95);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #fff;
      z-index: 10;
    }
    #game-over-screen { display: none; }
    .screen-title {
      font-size: 42px;
      color: #ff6b35;
      text-shadow: 0 0 20px rgba(255, 107, 53, 0.6);
      margin-bottom: 12px;
      letter-spacing: 4px;
    }
    .screen-subtitle {
      font-size: 16px;
      color: #7b2cbf;
      margin-bottom: 40px;
    }
    .screen-tip {
      font-size: 13px;
      color: #888;
      margin-bottom: 8px;
    }
    .start-btn {
      padding: 14px 48px;
      font-size: 16px;
      background: linear-gradient(135deg, #ff6b35, #ff9f1c);
      border: none;
      color: #0a0a0f;
      cursor: pointer;
      font-family: inherit;
      font-weight: bold;
      letter-spacing: 2px;
      margin-top: 20px;
      transition: transform 0.1s, box-shadow 0.2s;
    }
    .start-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 20px rgba(255, 107, 53, 0.5);
    }
    #controls-hint {
      position: absolute;
      bottom: 16px;
      right: 16px;
      color: #555;
      font-size: 11px;
      text-align: right;
      pointer-events: none;
    }
    #skill-tree-hint {
      position: absolute;
      top: 50px;
      right: 16px;
      color: #00d4ff;
      font-size: 12px;
      text-align: right;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s;
    }
  </style>
  <script type="module" crossorigin src="./assets/index-C24ff_fR.js"></script>
</head>
<body>
  <div id="game-container">
    <canvas id="game"></canvas>
    <div id="ui-overlay">
      <div class="hp-container">
        <div class="stat-label">HP</div>
        <div class="hp-bar"><div class="hp-fill" id="hp-fill"></div></div>
      </div>
      <div class="echo-container">
        <div class="stat-label">RESONANCE</div>
        <div class="echo-bar"><div class="echo-fill" id="echo-fill"></div></div>
      </div>
    </div>
    <div id="resonance-indicator"></div>
    <div id="corruption-overlay"></div>
    <div id="skill-tree-hint">[T] 技能树</div>
    <div id="controls-hint">WASD/方向键 移动 | 空格 闪避 | J 射击 | K 技能 | Q 切换武器</div>
    <div id="start-screen">
      <div class="screen-title">残响纪元</div>
      <div class="screen-subtitle">ASH ECHOES — 2.5D 侧视角射击</div>
      <div class="screen-tip">WASD / 方向键 — 移动</div>
      <div class="screen-tip">J — 射击 | K — 回响技能</div>
      <div class="screen-tip">空格 — 闪避</div>
      <button class="start-btn" id="start-btn">开始游戏</button>
    </div>
    <div id="game-over-screen">
      <div class="screen-title" style="color: #7b2cbf;">回响侵蚀</div>
      <div class="screen-subtitle">你已被回响吞噬...</div>
      <button class="start-btn" id="restart-btn">重新开始</button>
    </div>
  </div>
</body>
</html>
